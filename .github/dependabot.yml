version: 2

updates:
  - package-ecosystem: npm
    directories: ["/", "/**/*"]
    exclude-paths: ["**/node_modules/**", "**/dist/**", "**/artifacts/**", "**/.openclaw/**"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
      qualified-type-patches:
        applies-to: version-updates
        patterns: ["@types/leaflet"]
        update-types: [patch]
      npm-minor-patch:
        exclude-patterns: ["@types/leaflet"]
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      # Actions har bare standardkarantene; minor/major vurderes manuelt etter 7/30 dager.
      default-days: 3
    groups:
      actions-security:
        applies-to: security-updates
        patterns: ["*"]
      actions-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
