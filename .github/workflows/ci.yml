name: CI

permissions:
  contents: read

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Sjekk ut koden
        uses: actions/checkout@v7

      - name: Installer Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Installer avhengigheter
        run: npm ci

      - name: Kjør tester og bygg
        run: npm run check

      - name: Installer testnettleseren
        run: npx playwright install --with-deps chromium

      - name: Kontroller den pakkede kartflaten i nettleser
        run: npx playwright test
